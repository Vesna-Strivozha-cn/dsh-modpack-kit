url: https://github.com/Vesna-Strivozha-cn/dsh-modpack-kit
name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: PCL/HMCL-style modpacks for DeepSeek Harness: bundle plugins with their config and data into one .dshpack and install in one pass. Three strategies: full (installs offline), download-only (smallest), hybrid (per-plugin — only what cannot be fetched by version ships inside). Packing scans in memory and redacts suspected credentials (never written to disk; high-risk findings pause until confirmed); installing re-checks sha256, dependencies and licences. Categories, search, paging and groups share the plugin market, and installed plugins register as market versions. The plugin market is recommended, not required.
  zh: 类似 HMCL / PCL 的 DSH 整合包工具：把多个插件连同配置与数据打成一个 .dshpack，换台机器一次装好。三种策略——完整包（不联网也能装）、仅下载码（体积最小）、混合包（按插件分档，只把离不开本体的那几个打全）。打包前在内存里强制做安全扫描并擦除疑似凭据（原文不落盘，高危先停下等确认），安装前校验 sha256、依赖与许可证；分类、搜索、分页与分组和插件市场同源，装完按市场版登记。建议先装插件市场（dshmarket），不是必须。
