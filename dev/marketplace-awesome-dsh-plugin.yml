name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: 'Who says DSH cannot do modpacks? (Put these plugins together and it is genuinely good.) PCL/HMCL-style modpack tool for DeepSeek Harness: bundle several plugins with their config and data into one .dshpack, one-click pack, one-click install, works offline, no need to install each plugin by hand when moving to another machine. Also searched as: modpack, plugin bundle, one-click pack, one-click install, custom install, batch install, offline install, migrate plugins, back up plugin config, share a plugin combo. Three strategies: full (installs offline), download-only (smallest), hybrid (per-plugin: only what cannot be fetched by version ships inside); all three carry a standalone installer, so a machine with a bare DSH can still install it - plugins are copied into the local vendor folder and registered, already-installed ones are skipped unless you pass --replace. Installing lets you pick plugins one by one, choose packed vs local config, enable everything afterwards or keep it off, and sync the plugin market groups; install and pack share one progress window. Packing scans in memory and redacts suspected credentials (never written to disk; high-risk findings pause until confirmed, then the same job resumes from the checkpoint without rescanning); installing re-checks sha256, dependencies and licences. Sources: file or folder picker, any directory, the imported list and links; categories, search, paging, same-name market switch and groups share the plugin market, and search can use the market AI search on newer versions. The plugin market is recommended, not required. npm: https://www.npmjs.com/package/dsh-modpack-kit'
  zh: '谁说dsh不能整整合包呢？（你说这几个插件整一块不牛逼坏了） 类似 HMCL / PCL 的 DSH 整合包工具（modpack）：把多个插件连同配置与数据打成一个 .dshpack，一键打包、一键安装、离线也能装，换机器不用逐个安装。 常用叫法：整合包、插件打包、一键打包、一键安装、自定义安装、批量安装、离线安装、迁移或备份插件配置、打包分享插件组合。 三种策略：完整包（不联网也能装）、仅下载码（体积最小）、混合包（按插件分档，只把离不开本体的打全）；三种都带独立安装器，对方只剩一个裸 DSH 也能装——插件复制进本机 vendor 再登记，默认跳过已装的，加 --replace 才覆盖。 安装时可逐个挑插件、选包内配置或保留本机、装完整体启用或先不启用，并同步插件市场的分组；安装与打包共用进度窗。 打包前在内存里强制安全扫描并擦除疑似凭据（原文不落盘，高危先停下等确认，确认后同一任务从检测点续跑、不重扫）；安装前校验 sha256、依赖与许可证。 取包支持文件/文件夹选择器、任意目录、已导入列表与链接；分类、搜索、分页、同名切换市场版与分组都与插件市场同源，搜索还可用市场的新版 AI 搜索。 建议先装插件市场（dshmarket），不是必须。 npm：https://www.npmjs.com/package/dsh-modpack-kit'
