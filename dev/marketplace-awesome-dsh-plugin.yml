name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: HMCL/PCL-style modpack packaging for DeepSeek Harness: bundle several plugins with their configuration and data into one .dshpack and install it in a single pass. A full pack installs on a machine that only has DSH; a lite pack records names and versions and fetches them from the plugin market on install. Each plugin is packed as a preset (default configuration) or custom (local configuration and data, credentials redacted), configuration is re-applied by entry, and existing data files are never overwritten by default. Packing always scans for secrets and risky code in memory (masked, never written to disk); high-risk hits pause the job until confirmed, then it resumes from the checkpoint. Installation re-checks sha256 integrity, compatibility and licences, and can finish without enabling. Categories, search, paging and plugin groups come from the plugin market; groups collapse and can be added in one click. The UI can live in settings, the sidebar or the plugins tab. The plugin market is recommended, not required.
  zh: 为 DeepSeek Harness 提供类似 HMCL / PCL 的整合包打包与安装：把多个插件连同各自的配置与数据打成一个 .dshpack，一次装好。支持懒人包（目标机器只装 DSH 本体即可安装）与轻量包（只记插件名与版本，安装时按版本从插件市场取包）；每个插件单独选「插件预设」或「自定义配置」，配置按条目回填、数据写回且默认不覆盖已有文件，疑似凭据替换为 ${REDACTED}。打包前强制检查敏感信息与风险代码（命中只留掩码、原文不落盘），高风险先停在「等决定」，确认后从检测点续跑；安装前校验 sha256 完整性、兼容性与许可证，装完可选先不启用。分类、搜索、分页与插件市场目录同源，本机插件按市场的分组折叠展示、组头可一键加入或清空本组；三处入口（设置 / 侧边栏 / 插件页）各自独立开关。建议先装插件市场（dshmarket），但不是必须。
